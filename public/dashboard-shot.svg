  <text x="880" y="392" font-size="11" fill="#6e6e73" text-anchor="end">last 12 months</text>
  <g fill="#f3f4f6"><rect x="288" y="420" width="592" height="1"/><rect x="288" y="470" width="592" height="1"/><rect x="288" y="520" width="592" height="1"/><rect x="288" y="570" width="592" height="1"/></g>
