<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="627" viewBox="0 0 1280 627" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>Gershon.AI Finance dashboard (sample data, v2.19.0 unified design)</title>
  <rect width="1280" height="627" fill="#fafafa"/>
