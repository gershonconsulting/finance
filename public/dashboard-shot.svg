    <text x="1232" y="538" fill="#dc2626" font-weight="700" text-anchor="end">$5,800</text>
    <rect x="944" y="548" width="288" height="8" rx="4" fill="#f1f5f9"/>
    <rect x="944" y="548" width="10" height="8" rx="4" fill="#dc2626"/>
