    <text x="44" y="385">Bank</text>
  </g>
  <text x="24" y="425" font-size="10" font-weight="700" letter-spacing="0.6" fill="#6e6e73">REPORTS</text>
  <g font-size="13" fill="#1d1d1f">
    <text x="44" y="455">MoM Evolution</text>
    <text x="44" y="490">SWOT</text>
    <text x="44" y="525">Exec Reports</text>
  </g>
  <g fill="#c7c7cc">
    <rect x="24" y="166" width="12" height="12" rx="3"/><rect x="24" y="201" width="12" height="12" rx="3"/>
    <rect x="24" y="236" width="12" height="12" rx="3"/><rect x="24" y="271" width="12" height="12" rx="3"/>
    <rect x="24" y="306" width="12" height="12" rx="3"/><rect x="24" y="341" width="12" height="12" rx="3"/>
    <rect x="24" y="376" width="12" height="12" rx="3"/><rect x="24" y="446" width="12" height="12" rx="3"/>
    <rect x="24" y="481" width="12" height="12" rx="3"/><rect x="24" y="516" width="12" height="12" rx="3"/>
