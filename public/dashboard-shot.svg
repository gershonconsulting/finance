  <rect x="1086" y="18" width="70" height="22" rx="11" fill="#16a34a"/>
  <text x="1121" y="33" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Live</text>
  <text x="1168" y="33" font-size="11" fill="#6e6e73">Synced 9:41</text>

