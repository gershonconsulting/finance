  <text x="24" y="80" font-size="10" fill="#6e6e73">v2.19.0</text>
  <rect x="12" y="96" width="216" height="1" fill="#e5e7eb"/>
  <rect x="12" y="110" width="216" height="36" rx="8" fill="#CC3333"/>
