    <rect x="1020" y="76" width="236" height="96" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="1020" y="76" width="4" height="96" rx="2" fill="#dc2626"/>
    <text x="1040" y="102" font-size="11" letter-spacing="0.6" fill="#6e6e73">OVERDUE</text>
