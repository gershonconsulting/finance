    <rect x="348" y="490" width="30" height="80" rx="3"/>
    <rect x="396" y="482" width="30" height="88" rx="3"/>
    <rect x="444" y="494" width="30" height="76" rx="3"/>
    <rect x="492" y="478" width="30" height="92" rx="3"/>
    <rect x="540" y="470" width="30" height="100" rx="3"/>
    <rect x="588" y="462" width="30" height="108" rx="3"/>
    <rect x="636" y="474" width="30" height="96" rx="3"/>
    <rect x="684" y="458" width="30" height="112" rx="3"/>
    <rect x="732" y="452" width="30" height="118" rx="3"/>
    <rect x="828" y="440" width="30" height="130" rx="3"/>
  </g>
  <rect x="780" y="430" width="30" height="140" rx="3" fill="#f59e0b"/>
  <text x="795" y="424" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">best</text>
  <g font-size="10" fill="#6e6e73" text-anchor="middle">
    <text x="315" y="590">Nov</text><text x="363" y="590">Dec</text><text x="411" y="590">Jan</text><text x="459" y="590">Feb</text>
    <text x="507" y="590">Mar</text><text x="555" y="590">Apr</text><text x="603" y="590">May</text><text x="651" y="590">Jun</text>
    <text x="699" y="590">Jul</text><text x="747" y="590">Aug</text><text x="795" y="590">Sep</text><text x="843" y="590">Oct</text>
  </g>

  <!-- Aging card -->
  <rect x="920" y="362" width="336" height="245" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
