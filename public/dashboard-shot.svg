  <g font-size="12">
    <text x="944" y="426" fill="#1d1d1f">Current (0–99 days)</text>
    <text x="1232" y="426" fill="#16a34a" font-weight="700" text-anchor="end">$185,400</text>
    <rect x="944" y="436" width="288" height="8" rx="4" fill="#f1f5f9"/>
    <rect x="944" y="436" width="250" height="8" rx="4" fill="#16a34a"/>

    <text x="944" y="482" fill="#1d1d1f">Aged (100–199 days)</text>
    <text x="1232" y="482" fill="#d97706" font-weight="700" text-anchor="end">$22,600</text>
    <rect x="944" y="492" width="288" height="8" rx="4" fill="#f1f5f9"/>
    <rect x="944" y="492" width="31" height="8" rx="4" fill="#f59e0b"/>

